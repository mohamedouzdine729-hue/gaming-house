
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GAMING HOUSE PRO</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #101018;
  color: white;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}
.panel {
  width: 92%;
  max-width: 420px;
  padding: 35px;
  background: #1c1c28;
  border: 1px solid #333344;
  border-radius: 18px;
  text-align: center;
}
.logo {
  font-size: 55px;
}
h1 {
  font-size: 27px;
}
p {
  color: #aaaabb;
}
input {
  width: 100%;
  padding: 15px;
  margin: 8px 0;
  background: #101018;
  color: white;
  border: 1px solid #444455;
  border-radius: 8px;
  font-size: 16px;
}
button {
  width: 100%;
  padding: 15px;
  margin-top: 15px;
  background: #7655dc;
  color: white;
  border: none;
  border-radius: 8px;
  font-size: 16px;
  cursor: pointer;
}
button:disabled {
  opacity: 0.5;
}
#message {
  font-size: 14px;
  color: #fbbf24;
}
.footer {
  margin-top: 25px;
  font-size: 12px;
  color: #888899;
}
[hidden] {
  display: none !important;
}
</style>
</head>

<body>

<div class="panel" id="login">
  <div class="logo">🎮</div>
  <h1>GAMING HOUSE PRO</h1>
  <p>Bienvenue dans votre espace gaming</p>

  <form id="loginForm">
    <input type="email" id="email"
      placeholder="Adresse e-mail"
      autocomplete="email" required>

    <input type="password" id="password"
      placeholder="Mot de passe"
      autocomplete="current-password" required>

    <button type="submit" id="loginButton">
      Se connecter
    </button>
  </form>

  <p id="message" role="status"></p>

  <div class="footer">
    GAMING HOUSE PRO © 2026
    <br>
    Système de gestion gaming
  </div>
</div>

<div class="panel" id="dashboard" hidden>
  <div class="logo">🎮</div>
  <h1>GAMING HOUSE PRO</h1>
  <h2 id="welcome"></h2>
  <p id="role"></p>
  <p>Connexion Supabase réussie.</p>
  <button id="logoutButton">
    Se déconnecter
  </button>
  <p id="dashboardMessage" role="status"></p>
</div>

<script>
const SUPABASE_URL =
  "https://dsmxfszbcrucvlieqntp.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_ZC6136Few5cmJZJ-SHG-gQ_KDEzDWQT";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const login = document.getElementById("login");
const dashboard = document.getElementById("dashboard");
const message = document.getElementById("message");
const loginButton = document.getElementById("loginButton");

async function showDashboard(user) {
  const { data: profile, error } = await db
    .from("profiles")
    .select("display_name, username, role")
    .eq("id", user.id)
    .single();

  if (error || !profile) {
    await db.auth.signOut();
    throw new Error("Profil introuvable ou inaccessible.");
  }

  if (!["owner", "player"].includes(profile.role)) {
    await db.auth.signOut();
    throw new Error("Rôle non autorisé.");
  }

  document.getElementById("welcome").textContent =
    "Bienvenue, " +
    (profile.display_name || profile.username || "Utilisateur");

  document.getElementById("role").textContent =
    profile.role === "owner"
      ? "Espace Administrateur"
      : "Espace Joueur";

  login.hidden = true;
  dashboard.hidden = false;
}

document.getElementById("loginForm")
.addEventListener("submit", async function(event) {
  event.preventDefault();

  loginButton.disabled = true;
  message.textContent = "Connexion en cours...";

  try {
    const { data, error } =
      await db.auth.signInWithPassword({
        email: document.getElementById("email").value.trim(),
        password: document.getElementById("password").value
      });

    if (error) throw error;

    await showDashboard(data.user);
    message.textContent = "";
    document.getElementById("password").value = "";

  } catch (error) {
    message.textContent = error.message;
  } finally {
    loginButton.disabled = false;
  }
});

document.getElementById("logoutButton")
.addEventListener("click", async function() {
  const { error } = await db.auth.signOut();

  if (error) {
    document.getElementById("dashboardMessage")
      .textContent = error.message;
    return;
  }

  dashboard.hidden = true;
  login.hidden = false;
  message.textContent = "";
});

async function restoreSession() {
  try {
    const { data, error } = await db.auth.getSession();

    if (error) throw error;

    if (data.session) {
      await showDashboard(data.session.user);
    }
  } catch (error) {
    message.textContent = error.message;
  }
}


const originalShowDashboard = showDashboard;

const style = document.createElement("style");
style.textContent = `
#dashboard {
  max-width: 1200px;
  margin: 25px auto;
}
.stats, .stations {
  display: grid;
  grid-template-columns:
    repeat(auto-fit, minmax(200px, 1fr));
  gap: 15px;
  margin: 20px 0;
}
.stat, .station {
  background: #101018;
  border: 1px solid #333344;
  border-radius: 14px;
  padding: 20px;
}
.stat strong {
  display: block;
  font-size: 28px;
  margin-top: 12px;
}
.station h3 {
  margin-top: 0;
}
.timer {
  font-size: 30px;
  font-weight: bold;
  margin: 15px 0;
  font-variant-numeric: tabular-nums;
}
.available { color: #4ade80; }
.occupied { color: #f87171; }
.paused { color: #fbbf24; }
`;
document.head.appendChild(style);

const area = document.createElement("section");
area.innerHTML = `
<h2>Tableau de bord</h2>

<div class="stats" id="stats">
  <div class="stat">
    Revenus du jour
    <strong id="revenue">—</strong>
  </div>
  <div class="stat">
    Postes occupés
    <strong id="occupied">—</strong>
  </div>
  <div class="stat">
    Sessions du jour
    <strong id="sessionCount">—</strong>
  </div>
  <div class="stat">
    Extra Time du jour
    <strong id="extraCount">—</strong>
  </div>
</div>

<h2>Gestion des stations</h2>
<p id="stationMessage" role="status"></p>
<div class="stations" id="stations"></div>
`;

dashboard.insertBefore(
  area,
  document.getElementById("logoutButton")
);

let currentRole = null;
let activeSessions = [];
let stationList = [];
let refreshBusy = false;

function formatTime(seconds) {
  seconds = Math.max(0, Math.ceil(seconds));
  const h = Math.floor(seconds / 3600);
  const m = Math.floor(seconds % 3600 / 60);
  const s = seconds % 60;

  return [h, m, s]
    .map(n => String(n).padStart(2, "0"))
    .join(":");
}

function remainingTime(session) {
  const end = session.status === "paused"
    ? new Date(session.paused_at).getTime()
    : Date.now();

  const elapsed =
    (end - new Date(session.started_at).getTime()) / 1000
    - Number(session.total_paused_seconds || 0);

  const duration =
    (Number(session.base_duration_minutes || 60)
    + Number(session.extra_time_minutes || 0)) * 60;

  return formatTime(duration - elapsed);
}

function renderStations() {
  const container = document.getElementById("stations");
  container.replaceChildren();

  stationList.forEach(station => {
    const session = activeSessions.find(
      s => s.station_id === station.id
    );

    const card = document.createElement("article");
    card.className = "station";

    const title = document.createElement("h3");
    title.textContent =
      "🎮 " + (station.name ||
      "Poste " + station.station_number);

    const status = document.createElement("p");

    if (!station.is_active) {
      status.textContent = "● Hors service";
    } else if (session?.status === "paused") {
      status.textContent = "● En pause";
      status.className = "paused";
    } else if (session) {
      status.textContent = "● Occupé";
      status.className = "occupied";
    } else if (currentRole === "owner") {
      status.textContent = "● Disponible";
      status.className = "available";
    } else {
      status.textContent = "Disponibilité non vérifiée";
    }

    const timer = document.createElement("div");
    timer.className = "timer";
    timer.textContent = session
      ? remainingTime(session)
      : "--:--:--";

    if (session) {
      timer.dataset.sessionId = session.id;
    }

    const price = document.createElement("p");
    price.textContent = "30 DH / 60 min";

    card.append(title, status, timer, price);
    container.appendChild(card);
  });
}

async function loadDashboard() {
  if (refreshBusy || dashboard.hidden || !currentRole) {
    return;
  }

  refreshBusy = true;
  const info = document.getElementById("stationMessage");

  try {
    const [stations, sessions] = await Promise.all([
      db.from("stations")
        .select("*")
        .order("station_number"),

      db.from("sessions")
        .select("*")
        .in("status", ["running", "paused"])
    ]);

    if (stations.error) throw stations.error;
    if (sessions.error) throw sessions.error;

    stationList = stations.data || [];
    activeSessions = sessions.data || [];

    renderStations();

    if (currentRole === "owner") {
      const today = new Date();
      today.setHours(0, 0, 0, 0);

      const [daily, completed, extras] =
        await Promise.all([
          db.from("sessions")
            .select("id", { count: "exact", head: true })
            .gte("started_at", today.toISOString()),

          db.from("sessions")
            .select("total_amount")
            .eq("status", "completed")
            .gte("ended_at", today.toISOString()),

          db.from("extra_time_requests")
            .select("id", { count: "exact", head: true })
            .eq("status", "approved")
            .gte("reviewed_at", today.toISOString())
        ]);

      if (daily.error) throw daily.error;
      if (completed.error) throw completed.error;
      if (extras.error) throw extras.error;

      const revenue = (completed.data || [])
        .reduce((sum, s) =>
          sum + Number(s.total_amount || 0), 0);

      document.getElementById("revenue").textContent =
        revenue.toFixed(2) + " DH";

      document.getElementById("occupied").textContent =
        new Set(activeSessions.map(s => s.station_id)).size
        + " / " + stationList.length;

      document.getElementById("sessionCount").textContent =
        daily.count || 0;

      document.getElementById("extraCount").textContent =
        extras.count || 0;
    }

    info.textContent = "";

  } catch (error) {
    info.textContent = "Erreur : " + error.message;
  } finally {
    refreshBusy = false;
  }
}

showDashboard = async function(user) {
  await originalShowDashboard(user);

  const { data, error } = await db
    .from("profiles")
    .select("role")
    .eq("id", user.id)
    .single();

  if (error) {
    dashboard.hidden = true;
    login.hidden = false;
    await db.auth.signOut();
    throw error;
  }

  currentRole = data.role;

  document.getElementById("stats").hidden =
    currentRole !== "owner";

  await loadDashboard();
};

setInterval(() => {
  if (dashboard.hidden) return;

  document.querySelectorAll("[data-session-id]")
    .forEach(element => {
      const session = activeSessions.find(
        s => s.id === element.dataset.sessionId
      );

      if (session) {
        element.textContent = remainingTime(session);
      }
    });
}, 1000);

setInterval(loadDashboard, 10000);

restoreSession();
</script>

</body>
</html>
