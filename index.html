
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GAMING HOUSE PRO</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #101018;
  color: white;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}
.panel {
  width: 92%;
  max-width: 420px;
  padding: 35px;
  background: #1c1c28;
  border: 1px solid #333344;
  border-radius: 18px;
  text-align: center;
}
.logo {
  font-size: 55px;
}
h1 {
  font-size: 27px;
}
p {
  color: #aaaabb;
}
input {
  width: 100%;
  padding: 15px;
  margin: 8px 0;
  background: #101018;
  color: white;
  border: 1px solid #444455;
  border-radius: 8px;
  font-size: 16px;
}
button {
  width: 100%;
  padding: 15px;
  margin-top: 15px;
  background: #7655dc;
  color: white;
  border: none;
  border-radius: 8px;
  font-size: 16px;
  cursor: pointer;
}
button:disabled {
  opacity: 0.5;
}
#message {
  font-size: 14px;
  color: #fbbf24;
}
.footer {
  margin-top: 25px;
  font-size: 12px;
  color: #888899;
}
[hidden] {
  display: none !important;
}
</style>
</head>

<body>

<div class="panel" id="login">
  <div class="logo">🎮</div>
  <h1>GAMING HOUSE PRO</h1>
  <p>Bienvenue dans votre espace gaming</p>

  <form id="loginForm">
    <input type="email" id="email"
      placeholder="Adresse e-mail"
      autocomplete="email" required>

    <input type="password" id="password"
      placeholder="Mot de passe"
      autocomplete="current-password" required>

    <button type="submit" id="loginButton">
      Se connecter
    </button>
  </form>

  <p id="message" role="status"></p>

  <div class="footer">
    GAMING HOUSE PRO © 2026
    <br>
    Système de gestion gaming
  </div>
</div>

<div class="panel" id="dashboard" hidden>
  <div class="logo">🎮</div>
  <h1>GAMING HOUSE PRO</h1>
  <h2 id="welcome"></h2>
  <p id="role"></p>
  <p>Connexion Supabase réussie.</p>
  <button id="logoutButton">
    Se déconnecter
  </button>
  <p id="dashboardMessage" role="status"></p>
</div>

<script>
const SUPABASE_URL =
  "https://dsmxfszbcrucvlieqntp.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_ZC6136Few5cmJZJ-SHG-gQ_KDEzDWQT";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const login = document.getElementById("login");
const dashboard = document.getElementById("dashboard");
const message = document.getElementById("message");
const loginButton = document.getElementById("loginButton");

async function showDashboard(user) {
  const { data: profile, error } = await db
    .from("profiles")
    .select("display_name, username, role")
    .eq("id", user.id)
    .single();

  if (error || !profile) {
    await db.auth.signOut();
    throw new Error("Profil introuvable ou inaccessible.");
  }

  if (!["owner", "player"].includes(profile.role)) {
    await db.auth.signOut();
    throw new Error("Rôle non autorisé.");
  }

  document.getElementById("welcome").textContent =
    "Bienvenue, " +
    (profile.display_name || profile.username || "Utilisateur");

  document.getElementById("role").textContent =
    profile.role === "owner"
      ? "Espace Administrateur"
      : "Espace Joueur";

  login.hidden = true;
  dashboard.hidden = false;
}

document.getElementById("loginForm")
.addEventListener("submit", async function(event) {
  event.preventDefault();

  loginButton.disabled = true;
  message.textContent = "Connexion en cours...";

  try {
    const { data, error } =
      await db.auth.signInWithPassword({
        email: document.getElementById("email").value.trim(),
        password: document.getElementById("password").value
      });

    if (error) throw error;

    await showDashboard(data.user);
    message.textContent = "";
    document.getElementById("password").value = "";

  } catch (error) {
    message.textContent = error.message;
  } finally {
    loginButton.disabled = false;
  }
});

document.getElementById("logoutButton")
.addEventListener("click", async function() {
  const { error } = await db.auth.signOut();

  if (error) {
    document.getElementById("dashboardMessage")
      .textContent = error.message;
    return;
  }

  dashboard.hidden = true;
  login.hidden = false;
  message.textContent = "";
});

async function restoreSession() {
  try {
    const { data, error } = await db.auth.getSession();

    if (error) throw error;

    if (data.session) {
      await showDashboard(data.session.user);
    }
  } catch (error) {
    message.textContent = error.message;
  }
}

restoreSession();
</script>

</body>
</html>
